<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brokey – Architektur &amp; Datenfluss</title>
<style>
  /* ---- Brokey-Fonts (aus Resources/Fonts) ---- */
  @font-face { font-family:'Inter'; src:url("Brokey_APP/Resources/Fonts/Inter-Regular.ttf"); font-weight:400; font-display:swap; }
  @font-face { font-family:'Inter'; src:url("Brokey_APP/Resources/Fonts/Inter-Medium.ttf"); font-weight:500; font-display:swap; }
  @font-face { font-family:'Inter'; src:url("Brokey_APP/Resources/Fonts/Inter-SemiBold.ttf"); font-weight:600; font-display:swap; }
  @font-face { font-family:'Inter'; src:url("Brokey_APP/Resources/Fonts/Inter-Bold.ttf"); font-weight:700; font-display:swap; }
  @font-face { font-family:'Charter'; src:url("Brokey_APP/Resources/Fonts/Charter Regular.ttf"); font-weight:400; font-display:swap; }
  @font-face { font-family:'Charter'; src:url("Brokey_APP/Resources/Fonts/Charter Bold.ttf"); font-weight:700; font-display:swap; }
  @font-face { font-family:'JetBrains Mono'; src:url("Brokey_APP/Resources/Fonts/jetbrains-mono.regular.ttf"); font-weight:400; font-display:swap; }

  :root {
    /* Brokey-Palette (Colors.xaml) */
    --primary:#7C3AED; --primary-dark:#5B21B6;
    --bg:#FCFAFF; --surface:#FFFFFF; --surface-subtle:#F7F2FF;
    --border:#DED2F7; --border-soft:#EEEAF7;
    --ink:#101014; --ink-soft:#1C1B22;
    --gray400:#B8B0C9; --gray500:#766F88; --gray600:#4B4658;
    --success:#15803D; --danger:#B42318;
    /* Knoten-Typen */
    --ui:#7C3AED; --vm:#5B21B6; --service:#15803D; --controller:#B45309;
    --repo:#B42318; --context:#0E7490; --model:#4B4658; --db:#766F88; --infra:#9D94B3;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --serif:'Charter','Georgia','Times New Roman',serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); font-family:var(--font);
    display:flex; flex-direction:column; overflow:hidden; -webkit-font-smoothing:antialiased;
  }

  header {
    padding:14px 24px; border-bottom:1px solid var(--border);
    display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; background:var(--surface);
  }
  header h1 { font-family:var(--serif); font-size:22px; font-weight:700; letter-spacing:.3px; color:var(--ink); }
  header h1 em { font-style:normal; color:var(--primary); }
  .hint { color:var(--gray500); font-size:13px; }
  .toolbar { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-left:auto; }
  .toolbar label { font-size:13px; color:var(--gray600); display:flex; align-items:center; gap:6px; }
  select, input[type=text] {
    background:var(--surface); color:var(--ink); border:1px solid var(--border);
    border-radius:10px; padding:7px 11px; font-size:13px; font-family:var(--font); outline:none;
  }
  select:focus, input:focus { border-color:var(--primary); }
  button {
    background:var(--surface); color:var(--gray600); border:1px solid var(--border);
    border-radius:10px; padding:7px 14px; font-size:13px; font-family:var(--font); font-weight:600;
    cursor:pointer; transition:.15s;
  }
  button:hover { border-color:var(--primary); color:var(--primary); }
  button.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  button.primary:hover { background:var(--primary-dark); color:#fff; }

  .legend { display:flex; gap:16px; flex-wrap:wrap; padding:9px 24px; border-bottom:1px solid var(--border); background:var(--surface-subtle); }
  .legend span { font-size:12px; color:var(--gray600); display:flex; align-items:center; gap:6px; }
  .legend i { width:10px; height:10px; border-radius:3px; display:inline-block; }

  .main { flex:1; display:flex; min-height:0; }
  .stage { flex:1; overflow:auto; position:relative; }
  #canvasWrap { position:relative; }
  #edges { position:absolute; top:0; left:0; pointer-events:none; }

  .colhead { position:absolute; }
  .colhead b {
    font-family:var(--serif); font-size:13px; font-weight:700; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--primary); display:block;
  }
  .colhead small { display:block; font-size:11px; color:var(--gray500); margin-top:2px; }

  .node {
    position:absolute; height:38px; border-radius:11px; padding:0 12px 0 11px;
    display:flex; align-items:center; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--c);
    cursor:pointer; transition:opacity .2s, transform .1s, box-shadow .15s; user-select:none;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
    box-shadow:0 1px 2px rgba(16,16,20,.05);
  }
  .node::before { content:""; width:7px; height:7px; border-radius:50%; margin-right:9px; flex:none; background:var(--c); }
  .node:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(91,33,182,.14); border-color:var(--c); }
  .node.selected { border-color:var(--primary); box-shadow:0 0 0 3px rgba(124,58,237,.16), 0 6px 16px rgba(91,33,182,.18); }
  .node.hl { z-index:5; }

  .type-ui{--c:var(--ui)} .type-vm{--c:var(--vm)} .type-service{--c:var(--service)}
  .type-controller{--c:var(--controller)} .type-repo{--c:var(--repo)} .type-context{--c:var(--context)}
  .type-model{--c:var(--model)} .type-db{--c:var(--db)} .type-infra{--c:var(--infra)}

  #canvasWrap.focus .node:not(.hl) { opacity:.26; }
  #canvasWrap.focus .edge-group:not(.hl) { opacity:.10; }

  .edge { fill:none; stroke:var(--gray400); stroke-width:1.5; }
  .edge.dashed { stroke-dasharray:5 4; }
  .edge-group.hl .edge { stroke:var(--primary); stroke-width:2.5; }
  .edge-label {
    fill:var(--ink-soft); font-size:11px; font-family:var(--mono);
    paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; opacity:0;
  }
  .edge-group.hl .edge-label { opacity:1; }
  #canvasWrap.showlabels .edge-label { opacity:.9; }

  .boundary { stroke:var(--border); stroke-width:1.4; stroke-dasharray:3 6; }
  .boundary-label { fill:var(--gray500); font-size:11px; font-family:var(--font); font-weight:600; letter-spacing:.8px; }

  .panel {
    width:372px; flex:none; background:var(--surface); border-left:1px solid var(--border);
    overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:15px;
  }
  .panel .ph { font-size:13px; color:var(--gray500); line-height:1.5; }
  .panel .kicker { font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--gray500); font-weight:600; }
  .panel h2 { font-family:var(--serif); font-size:21px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:9px; line-height:1.15; }
  .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  .filepath { font-family:var(--mono); font-size:11.5px; color:var(--gray500); word-break:break-all; background:var(--surface-subtle); padding:7px 9px; border-radius:8px; }
  .desc { font-size:14px; line-height:1.6; color:var(--gray600); }
  .section-title { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--primary); font-weight:700; margin-bottom:9px; padding-bottom:5px; border-bottom:1px solid var(--border); }
  .conn { font-size:13px; line-height:1.5; margin-bottom:11px; padding-left:15px; position:relative; }
  .conn::before { content:""; position:absolute; left:0; top:6px; width:7px; height:7px; border-radius:2px; background:var(--primary); }
  .conn .who { font-weight:700; cursor:pointer; color:var(--ink); }
  .conn .who:hover { color:var(--primary); text-decoration:underline; }
  .conn .data { color:var(--gray500); font-family:var(--mono); font-size:11px; }
  .steplist { counter-reset:s; }
  .step { font-size:13px; line-height:1.55; padding:9px 0 9px 32px; position:relative; border-bottom:1px solid var(--border-soft); color:var(--gray600); }
  .step::before {
    counter-increment:s; content:counter(s); position:absolute; left:0; top:9px;
    width:21px; height:21px; border-radius:50%; background:var(--primary); color:#fff;
    font-weight:700; font-size:11px; font-family:var(--font); display:flex; align-items:center; justify-content:center;
  }
  .step .n { font-weight:700; color:var(--ink); cursor:pointer; }
  .step .n:hover { color:var(--primary); }
  .empty { color:var(--gray400); font-size:12.5px; font-style:italic; }
</style>
</head>
<body>
<header>
  <h1>Brokey <em>Architektur &amp; Datenfluss</em></h1>
  <span class="hint">Auf eine Datei klicken für ihre Verbindungen, oder oben ein Szenario abspielen.</span>
  <div class="toolbar">
    <label>Szenario
      <select id="scenario"><option value="">– wählen –</option></select>
    </label>
    <button id="playBtn" class="primary">Abspielen</button>
    <input type="text" id="search" placeholder="Datei suchen" style="width:140px">
    <label><input type="checkbox" id="lblToggle"> Beschriftungen</label>
    <button id="reset">Zurücksetzen</button>
  </div>
</header>

<div class="legend" id="legend"></div>

<div class="main">
  <div class="stage">
    <div id="canvasWrap"><svg id="edges"></svg></div>
  </div>
  <aside class="panel" id="panel">
    <div class="ph">Wähle links eine Datei oder spiele oben ein Szenario ab, um die Datenflüsse zu sehen.</div>
  </aside>
</div>

/* ============================================================
   RENDERING
   ============================================================ */
const wrap = document.getElementById('canvasWrap');
const svg = document.getElementById('edges');
const panel = document.getElementById('panel');
const nodeById = {};
N.forEach(n => nodeById[n[0]] = { id:n[0], label:n[1], layer:n[2], row:n[3], type:n[4], file:n[5], desc:n[6] });

function box(n){
  const x = LAYERS[n.layer].x, y = TOP + n.row*ROWH;
  return { x, y, w:NW, h:NODEH, cx:x+NW/2, cy:y+NODEH/2, left:x, right:x+NW, top:y, bottom:y+NODEH };
}

let maxRow = 0, maxX = 0;
N.forEach(n => { maxRow = Math.max(maxRow, n[3]); maxX = Math.max(maxX, LAYERS[n[2]].x + NW); });
const CW = maxX + 60, CH = TOP + (maxRow+1)*ROWH + 30;
wrap.style.width = CW + 'px';
wrap.style.height = CH + 'px';
svg.setAttribute('width', CW); svg.setAttribute('height', CH);

LAYERS.forEach(l => {
  const h = document.createElement('div');
  h.className = 'colhead';
  h.style.left = l.x + 'px'; h.style.top = '32px'; h.style.width = NW + 'px';
  h.innerHTML = '<b>' + l.title + '</b><small>' + l.sub + '</small>';
  wrap.appendChild(h);
});

const bx = (LAYERS[2].x + NW + LAYERS[3].x) / 2;
const svgNS = 'http://www.w3.org/2000/svg';
function mk(tag, attrs){ const e=document.createElementNS(svgNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
const defs = mk('defs');
defs.innerHTML =
  '<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">'+
  '<path d="M0,0 L7,3 L0,6 Z" fill="#B8B0C9"/></marker>'+
  '<marker id="arrowHl" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">'+
  '<path d="M0,0 L7,3 L0,6 Z" fill="#7C3AED"/></marker>';
svg.appendChild(defs);
svg.appendChild(mk('line',{x1:bx,y1:62,x2:bx,y2:CH-20,class:'boundary'}));
const bl = mk('text',{x:bx+8,y:78,class:'boundary-label'});
bl.textContent = 'HTTP / HTTPS · JSON · Bearer-Token';
svg.appendChild(bl);

const edgeGroups = [];
function endpoints(a,b){
  if(a.layer === b.layer){
    if(b.top >= a.bottom) return {x1:a.cx,y1:a.bottom,x2:b.cx,y2:b.top,vert:1};
    return {x1:a.cx,y1:a.top,x2:b.cx,y2:b.bottom,vert:1};
  }
  if(b.cx >= a.cx) return {x1:a.right,y1:a.cy,x2:b.left,y2:b.cy,vert:0};
  return {x1:a.left,y1:a.cy,x2:b.right,y2:b.cy,vert:0};
}
function pathD(p){
  if(p.vert){
    const dy = Math.max(26, Math.abs(p.y2-p.y1)/2) * (p.y2>=p.y1?1:-1);
    return `M${p.x1},${p.y1} C${p.x1},${p.y1+dy} ${p.x2},${p.y2-dy} ${p.x2},${p.y2}`;
  }
  const dx = Math.max(40, Math.abs(p.x2-p.x1)/2) * (p.x2>=p.x1?1:-1);
  return `M${p.x1},${p.y1} C${p.x1+dx},${p.y1} ${p.x2-dx},${p.y2} ${p.x2},${p.y2}`;
}
E.forEach(([from,to,label,dashed]) => {
  const a = box(nodeById[from]), b = box(nodeById[to]);
  const p = endpoints(a,b);
  const g = mk('g',{class:'edge-group'});
  const path = mk('path',{d:pathD(p),class:'edge'+(dashed?' dashed':''),'marker-end':'url(#arrow)'});
  g.appendChild(path);
  const t = mk('text',{x:(p.x1+p.x2)/2,y:(p.y1+p.y2)/2 - 5,class:'edge-label','text-anchor':'middle'});
  t.textContent = label;
  g.appendChild(t);
  svg.appendChild(g);
  edgeGroups.push({ el:g, path, from, to });
});

N.forEach(n => {
  const nb = box(nodeById[n[0]]);
  const d = document.createElement('div');
  d.className = 'node type-' + n[4];
  d.dataset.id = n[0];
  d.style.left = nb.x + 'px'; d.style.top = nb.y + 'px'; d.style.width = NW + 'px';
  d.textContent = n[1];
  d.title = n[5];
  d.addEventListener('click', (ev) => { ev.stopPropagation(); selectNode(n[0]); });
  wrap.appendChild(d);
});

/* ============================================================
   INTERAKTION
   ============================================================ */
function clearHl(){
  wrap.classList.remove('focus');
  document.querySelectorAll('.node').forEach(n => n.classList.remove('hl','selected'));
  edgeGroups.forEach(e => { e.el.classList.remove('hl'); e.path.setAttribute('marker-end','url(#arrow)'); });
}
function nodeEl(id){ return document.querySelector('.node[data-id="'+id+'"]'); }

function selectNode(id){
  clearHl();
  wrap.classList.add('focus');
  const sel = nodeEl(id); sel.classList.add('hl','selected');
  const incoming = [], outgoing = [];
  edgeGroups.forEach(e => {
    if(e.from === id || e.to === id){
      e.el.classList.add('hl');
      e.path.setAttribute('marker-end','url(#arrowHl)');
      const other = e.from === id ? e.to : e.from;
      nodeEl(other).classList.add('hl');
      const meta = E.find(x => x[0]===e.from && x[1]===e.to);
      if(e.from === id) outgoing.push([e.to, meta[2]]);
      else incoming.push([e.from, meta[2]]);
    }
  });
  renderNodePanel(id, incoming, outgoing);
}

function renderNodePanel(id, incoming, outgoing){
  const n = nodeById[id];
  const color = getComputedStyle(document.documentElement).getPropertyValue('--'+n.type);
  let html = '';
  html += '<div class="kicker">'+TYPE_LABEL[n.type]+'</div>';
  html += '<h2><span class="dot" style="background:'+color+'"></span>'+n.label+'</h2>';
  html += '<div class="filepath">'+n.file+'</div>';
  html += '<div class="desc">'+n.desc+'</div>';
  html += '<div><div class="section-title">Sendet Daten an ('+outgoing.length+')</div>';
  html += outgoing.length ? outgoing.map(o =>
    '<div class="conn"><span class="who" data-go="'+o[0]+'">'+nodeById[o[0]].label+'</span><br><span class="data">'+o[1]+'</span></div>'
  ).join('') : '<div class="empty">– nichts –</div>';
  html += '</div>';
  html += '<div><div class="section-title">Bekommt Daten von ('+incoming.length+')</div>';
  html += incoming.length ? incoming.map(o =>
    '<div class="conn"><span class="who" data-go="'+o[0]+'">'+nodeById[o[0]].label+'</span><br><span class="data">'+o[1]+'</span></div>'
  ).join('') : '<div class="empty">– nichts –</div>';
  html += '</div>';
  panel.innerHTML = html;
  panel.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => {
    selectNode(el.dataset.go);
    nodeEl(el.dataset.go).scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
  }));
}

let playTimer = null;
function showScenario(key, animate){
  clearTimeout(playTimer);
  clearHl();
  const sc = SCENARIOS[key];
  if(!sc) return;
  wrap.classList.add('focus');
  const ids = sc.steps.map(s => s[0]);
  const set = new Set(ids);
  edgeGroups.forEach(e => {
    if(set.has(e.from) && set.has(e.to)){
      e.el.classList.add('hl'); e.path.setAttribute('marker-end','url(#arrowHl)');
    }
  });
  let html = '<div class="kicker">Szenario · Datenfluss</div><h2>'+sc.name+'</h2><div class="steplist">';
  sc.steps.forEach(s => {
    html += '<div class="step"><span class="n" data-go="'+s[0]+'">'+nodeById[s[0]].label+'</span><br>'+s[1]+'</div>';
  });
  html += '</div>';
  panel.innerHTML = html;
  panel.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => {
    nodeEl(el.dataset.go).scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
  }));

  if(animate){
    ids.forEach(i => nodeEl(i).classList.remove('hl'));
    let k = 0;
    const tick = () => {
      if(k >= ids.length) return;
      const el = nodeEl(ids[k]);
      el.classList.add('hl');
      el.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
      k++;
      playTimer = setTimeout(tick, 850);
    };
    tick();
  } else {
    ids.forEach(i => nodeEl(i).classList.add('hl'));
  }
}

const scenarioSel = document.getElementById('scenario');
Object.keys(SCENARIOS).forEach(k => {
  const o = document.createElement('option'); o.value = k; o.textContent = SCENARIOS[k].name;
  scenarioSel.appendChild(o);
});
scenarioSel.addEventListener('change', () => { if(scenarioSel.value) showScenario(scenarioSel.value, false); });
document.getElementById('playBtn').addEventListener('click', () => {
  if(!scenarioSel.value) scenarioSel.value = 'login';
  showScenario(scenarioSel.value, true);
});
document.getElementById('reset').addEventListener('click', () => {
  clearTimeout(playTimer); clearHl(); scenarioSel.value = '';
  panel.innerHTML = '<div class="ph">Wähle links eine Datei oder spiele oben ein Szenario ab, um die Datenflüsse zu sehen.</div>';
});
document.getElementById('lblToggle').addEventListener('change', e => {
  wrap.classList.toggle('showlabels', e.target.checked);
});
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if(!q){ document.querySelectorAll('.node').forEach(n=>n.style.outline=''); return; }
  let first = null;
  document.querySelectorAll('.node').forEach(n => {
    const hit = n.textContent.toLowerCase().includes(q);
    n.style.outline = hit ? '2px solid var(--primary)' : '';
    if(hit && !first) first = n;
  });
  if(first) first.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
});
wrap.addEventListener('click', () => {
  clearTimeout(playTimer); clearHl();
  panel.innerHTML = '<div class="ph">Wähle links eine Datei oder spiele oben ein Szenario ab, um die Datenflüsse zu sehen.</div>';
});

const legend = document.getElementById('legend');
Object.entries(TYPE_LABEL).forEach(([t,lbl]) => {
  const s = document.createElement('span');
  const col = getComputedStyle(document.documentElement).getPropertyValue('--'+t);
  s.innerHTML = '<i style="background:'+col+'"></i>'+lbl;
  legend.appendChild(s);
});
